<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Aid Pop 急救彈彈樂!</title>

<style>
body{
    margin:0;
    background:#d8f1ff;
    text-align:center;
    font-family: 'Arial Black', Arial, sans-serif; /* 換上更有遊戲感的字體 */
    touch-action: none;
    user-select: none;
}

/* 遊戲專屬大招牌 */
.game-title {
    margin: 15px 0 5px 0;
    color: #e74c3c;
    font-size: 28px;
    font-weight: 900;
    text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff, 3px 3px 5px rgba(0,0,0,0.2);
    letter-spacing: 1px;
}

.info-bar { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #2c3e50; font-family: Arial, sans-serif;}

.board-container {
    position: relative;
    display: inline-block;
    margin-top: 10px;
}

.board{
    display:grid;
    grid-template-columns:repeat(8,60px);
    gap:6px;
    justify-content:center;
}
.cell{
    width:60px;height:60px;background:#fff;border-radius:10px;
    position:relative;
    box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
    box-sizing: border-box;
}

.selected {
    border: 3px solid #e74c3c !important;
    background: #ffeaea !important;
}

.disk{
    display:flex;align-items:center;justify-content:center;
    height:100%;font-size:34px;cursor:pointer;
    transition: transform 0.1s ease;
}
.disk:active { transform: scale(0.9); }

.particle{
    position:absolute;
    font-size:20px;
    pointer-events:none;
    z-index: 999;
    animation:explode 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
}
@keyframes explode{
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--x),var(--y)) scale(0.5); opacity:0; }
}

.control-panel { margin: 10px; }
.music-btn{
    padding:8px 15px;
    border:none;border-radius:15px;
    background:#2ecc71;color:#fff;font-weight:bold;
    cursor: pointer; box-shadow: 0 3px 5px rgba(0,0,0,0.1);
    font-size: 14px;
    font-family: Arial, sans-serif;
}
.music-btn:active { transform: scale(0.95); }
</style>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body>

<div class="game-title">🚑 First Aid Pop! <br><span style="color:#1a5f7a; font-size:22px;">急救彈彈樂!</span></div>

<div class="control-panel">
    <button class="music-btn" onclick="toggleMusic()">🎵 音樂開關 (BGM)</button>
</div>

<div class="info-bar">得分: <span id="score">0</span></div>

<div class="board-container" id="game-container">
    <div id="board" class="board"></div>
</div>

<script>
const SIZE=8;
const TYPES=["😷","🏋️","🩺","💉","🚑","💊","🩹","🥼"];
let grid=[], score=0;
let last=null; 
let isAnimating = false; 

const board=document.getElementById("board");
const gameContainer = document.getElementById("game-container");

const sounds={
 match: new Audio("https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3"),
};

function playSound(s){
 try {
     let a=s.cloneNode(); a.volume=0.4; a.play();
 } catch(e) {}
}

const bgm=new Audio("https://assets.mixkit.co/music/preview/mixkit-game-level-music-689.mp3");
bgm.loop=true;
bgm.volume=0.3;

function toggleMusic(){
 if(bgm.paused) bgm.play().catch(()=>{ alert("請先點擊畫面上任意地方激活音源"); });
 else bgm.pause();
}

document.body.addEventListener("pointerdown",()=>{
 bgm.play().catch(()=>{});
},{once:true});

function vibrate(){
 if(navigator.vibrate){ navigator.vibrate(60); }
}

function explodeEffect(r,c){
 const cell=document.getElementById(`cell-${r}-${c}`);
 if(!cell) return;

 const offsetLeft = cell.offsetLeft + cell.offsetWidth / 2 - 10;
 const offsetTop = cell.offsetTop + cell.offsetHeight / 2 - 10;

 for(let i=0;i<8;i++){
   let p=document.createElement("div");
   p.className="particle";
   p.innerText= ["✨","💥","✨"][Math.floor(Math.random()*3)]; 
   p.style.left = offsetLeft + "px";
   p.style.top = offsetTop + "px";

   let x=(Math.random()*120-60)+"px";
   let y=(Math.random()*120-60)+"px";

   p.style.setProperty("--x",x);
   p.style.setProperty("--y",y);

   gameContainer.appendChild(p);
   setTimeout(()=>p.remove(),600);
 }
}

function create(){
 let g;
 do {
    g = [];
    for(let r=0;r<SIZE;r++){
       let row=[];
       for(let c=0;c<SIZE;c++){
         row.push(TYPES[Math.floor(Math.random()*8)]);
       }
       g.push(row);
    }
 } while(hasMatch(g)); 
 return g;
}

function hasMatch(g){
    for(let r=0;r<SIZE;r++){
        for(let c=0;c<SIZE;c++){
            if(c<=SIZE-3 && g[r][c] && g[r][c]===g[r][c+1] && g[r][c]===g[r][c+2]) return true;
            if(r<=SIZE-3 && g[r][c] && g[r][c]===g[r+1][c] && g[r][c]===g[r+2][c]) return true;
        }
    }
    return false;
}

function render(){
 board.innerHTML="";
 grid.forEach((row,r)=>{
   row.forEach((cell,c)=>{
     let div=document.createElement("div");
     div.className="cell";
     div.id=`cell-${r}-${c}`;

     if(last && last.r === r && last.c === c) {
         div.classList.add("selected");
     }

     if(cell){
       let d=document.createElement("div");
       d.className="disk";
       d.innerText=cell;
       d.onclick=()=>click(r,c);
       div.appendChild(d);
     }
     board.appendChild(div);
   });
 });
}

function click(r,c){
 if(isAnimating) return; 

 if(!last){
     last={r,c}; 
     render(); 
     return;
 }

 let dr=Math.abs(last.r-r);
 let dc=Math.abs(last.c-c);

 if(dr+dc==1){
   isAnimating = true;
   [grid[r][c],grid[last.r][last.c]]=[grid[last.r][last.c],grid[r][c]];
   render();

   setTimeout(() => {
       if(!checkMatchesAndEliminate(r, c, last.r, last.c)) {
           [grid[r][c],grid[last.r][last.c]]=[grid[last.r][last.c],grid[r][c]];
           isAnimating = false;
           last = null;
           render();
       } else {
           last = null;
       }
   }, 150);
 } else {
   last={r,c};
   render();
 }
}

function checkMatchesAndEliminate(r1, c1, r2, c2) {
 let toRemove = Array.from({length: SIZE}, () => Array(SIZE).fill(false));
 let hasMatchFound = false;

 for(let r=0;r<SIZE;r++){
   for(let c=0;c<SIZE-2;c++){
     let v=grid[r][c];
     if(v && v===grid[r][c+1] && v===grid[r][c+2]){
       toRemove[r][c] = toRemove[r][c+1] = toRemove[r][c+2] = true;
       hasMatchFound = true;
     }
   }
 }

 for(let c=0;c<SIZE;c++){
   for(let r=0;r<SIZE-2;r++){
     let v=grid[r][c];
     if(v && v===grid[r+1][c] && v===grid[r+2][c]){
       toRemove[r][c] = toRemove[r+1][c] = toRemove[r+2][c] = true;
       hasMatchFound = true;
     }
   }
 }

 if(hasMatchFound){
   let removedCount = 0;
   for(let r=0;r<SIZE;r++){
     for(let c=0;c<SIZE;c++){
       if(toRemove[r][c]) {
         explodeEffect(r,c); 
         grid[r][c]=null; 
         removedCount++;
       }
     }
   }

   playSound(sounds.match);
   vibrate(); 
   score+=removedCount*10;
   document.getElementById("score").innerText=score;
   
   setTimeout(drop, 250);
   return true;
 }
 return false;
}

function autoCheckLoop() {
    let toRemove = Array.from({length: SIZE}, () => Array(SIZE).fill(false));
    let hasMatchFound = false;

    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE-2;c++){
        let v=grid[r][c];
        if(v && v===grid[r][c+1] && v===grid[r][c+2]) toRemove[r][c] = toRemove[r][c+1] = toRemove[r][c+2] = hasMatchFound = true;
      }
    }
    for(let c=0;c<SIZE;c++){
      for(let r=0;r<SIZE-2;r++){
        let v=grid[r][c];
        if(v && v===grid[r+1][c] && v===grid[r+2][c]) toRemove[r][c] = toRemove[r+1][c] = toRemove[r+2][c] = hasMatchFound = true;
      }
    }

    if(hasMatchFound) {
        let count = 0;
        for(let r=0;r<SIZE;r++){
          for(let c=0;c<SIZE;c++){
            if(toRemove[r][c]) { explodeEffect(r,c); grid[r][c]=null; count++; }
          }
        }
        score += count * 10;
        document.getElementById("score").innerText=score;
        playSound(sounds.match);
        vibrate();
        setTimeout(drop, 250);
    } else {
        isAnimating = false; 
    }
}

function drop(){
 for(let c=0;c<SIZE;c++){
   let col=[];
   for(let r=0;r<SIZE;r++)
     if(grid[r][c]) col.push(grid[r][c]);

   while(col.length<SIZE)
     col.unshift(TYPES[Math.floor(Math.random()*8)]);

   for(let r=0;r<SIZE;r++)
     grid[r][c]=col[r];
 }
 render();
 setTimeout(autoCheckLoop, 150);
}

grid=create();
render();
</script>

</body>
</html>
