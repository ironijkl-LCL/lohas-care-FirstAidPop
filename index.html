<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>First Aid Pop! 急救突圍</title>
<style>
:root {
    --bg-gradient: linear-gradient(135deg, #d8e5dd 0%, #d5e0e6 100%);
    --oasis-green: #2c6e49;
    --oasis-green-light: #e8f3ec;
    --apple-dark: #1d1d1f;
    --apple-gray: #6e6e73;
    --apple-card-bg: rgba(255, 255, 255, 0.92);
    --apple-border: rgba(255, 255, 255, 0.85);
    --apple-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.08);
    --system-red: #d70015;
    --system-orange: #c93400;
    --system-purple: #8944ab;
    --system-blue: #0062cc;
}
* { -webkit-tap-highlight-color: transparent; }
html, body {
    width: 100%; height: 100%; margin: 0; padding: 0;
    overflow: hidden; touch-action: none;
}
body {
    background: var(--bg-gradient);
    background-attachment: fixed; text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    color: var(--apple-dark); user-select: none; -webkit-user-select: none;
    padding: 8px 12px 20px 12px; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
}
.game-title {
    margin: 2px 0 6px 0; font-size: 19px; font-weight: 800;
    letter-spacing: -0.5px; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.control-panel {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 440px; margin-bottom: 6px;
}
.level-badge {
    background: var(--apple-card-bg); backdrop-filter: blur(20px);
    padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: 700;
    border: 1px solid var(--apple-border); box-shadow: var(--apple-shadow);
}
.btn-group { display: flex; gap: 6px; }
.tool-btn {
    padding: 5px 10px; border: 1px solid var(--apple-border);
    border-radius: 16px; background: var(--apple-card-bg);
    font-weight: 700; cursor: pointer; font-size: 12px;
    box-shadow: var(--apple-shadow);
}
.timer-container {
    width: 100%; max-width: 440px; background: rgba(0, 0, 0, 0.08);
    height: 7px; border-radius: 4px; margin-bottom: 4px; overflow: hidden;
}
.timer-bar {
    width: 100%; height: 100%; background: var(--oasis-green);
    border-radius: 4px; transition: width 0.1s linear, background-color 0.3s ease;
}
.info-bar { 
    font-size: 13px; font-weight: 700; margin-bottom: 6px;
    display: flex; justify-content: space-between; width: 100%; max-width: 440px;
}
.info-pill {
    background: var(--apple-card-bg); padding: 4px 10px;
    border-radius: 14px; border: 1px solid var(--apple-border);
}
.scenario-card {
    background: var(--apple-card-bg); backdrop-filter: blur(20px);
    border-radius: 16px; padding: 10px 12px; width: 100%; max-width: 440px;
    margin-bottom: 8px; border: 1px solid var(--apple-border);
    box-shadow: var(--apple-shadow); text-align: left; box-sizing: border-box;
    transition: background-color 0.2s, border-color 0.2s;
}
.scenario-card.card-penalty {
    background: #ffe5e5 !important; border-color: var(--system-red) !important;
    animation: shake 0.28s ease;
}
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
}
.scenario-title { font-size: 13px; font-weight: 800; color: var(--system-red); margin-bottom: 2px; }
.scenario-desc { font-size: 11px; color: var(--apple-gray); margin-bottom: 6px; line-height: 1.3; }
.protocol-steps { display: flex; flex-direction: column; gap: 4px; }
.protocol-step {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255, 255, 255, 0.7); padding: 5px 8px;
    border-radius: 8px; font-size: 11px; font-weight: 700;
}
.protocol-step.active {
    background: #ffffff; border: 1.5px solid var(--system-blue);
    box-shadow: 0 2px 6px rgba(0, 98, 204, 0.15);
}
.protocol-step.completed {
    background: var(--oasis-green-light); color: var(--oasis-green);
    border: 1px solid var(--oasis-green);
}
.protocol-step.locked { opacity: 0.45; }
.step-tag { font-size: 10px; padding: 1px 6px; border-radius: 6px; }
.tag-active { background: #e0edff; color: var(--system-blue); }
.tag-done { background: #dff0e6; color: var(--oasis-green); }

.ambulance-action-bar {
    width: 100%; max-width: 440px; margin-bottom: 6px; display: flex; gap: 8px;
}
.btn-ambulance {
    flex: 1; background: var(--apple-dark); color: white; border: none;
    padding: 7px 12px; font-size: 12px; font-weight: 700; border-radius: 14px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;
}
.btn-ambulance:disabled { background: #bbb; cursor: not-allowed; }

.board-container {
    position: relative; width: 100%; max-width: 440px; box-sizing: border-box;
}
.board {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px;
    background: rgba(255, 255, 255, 0.55); backdrop-filter: blur(25px);
    padding: 6px; border-radius: 18px; border: 1px solid var(--apple-border);
    box-shadow: var(--apple-shadow);
}
.cell {
    width: 100%; aspect-ratio: 1; background: rgba(255, 255, 255, 0.85);
    border-radius: 10px; position: relative; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255, 255, 255, 0.7);
}
.cell.selected { border: 2.5px solid var(--apple-dark) !important; background: #fff !important; }
.disk { font-size: 24px; pointer-events: none; }
.hint-glow {
    animation: flash 0.5s ease-in-out 3;
}
@keyframes flash {
    0%, 100% { background: rgba(255, 255, 255, 0.85); }
    50% { background: #fef08a !important; transform: scale(1.08); }
}

#cpr-stage-container {
    display: none; width: 100%; max-width: 440px; background: var(--apple-card-bg);
    border: 2px solid var(--system-red); border-radius: 20px;
    padding: 16px 12px; box-sizing: border-box; box-shadow: 0 10px 30px rgba(215, 0, 21, 0.15);
}
.cpr-title { font-size: 16px; font-weight: 800; color: var(--system-red); margin-bottom: 2px; }
.cpr-sub { font-size: 11px; color: var(--apple-gray); margin-bottom: 12px; }
.cpr-heart-wrapper {
    position: relative; width: 110px; height: 110px; margin: 0 auto 8px auto;
    display: flex; align-items: center; justify-content: center;
}
.cpr-heart-btn {
    width: 84px; height: 84px; background: linear-gradient(135deg, #ff453a 0%, #d70015 100%);
    border-radius: 50%; border: none; font-size: 38px; cursor: pointer;
    box-shadow: 0 6px 20px rgba(215, 0, 21, 0.35); z-index: 2;
}
.cpr-heart-btn:active { transform: scale(0.9); }
.cpr-pulse-ring {
    position: absolute; width: 100%; height: 100%; border-radius: 50%;
    border: 3px solid var(--system-red); opacity: 0; pointer-events: none;
    animation: pulse 0.545s ease-out infinite;
}
@keyframes pulse {
    0% { transform: scale(0.75); opacity: 0.9; }
    100% { transform: scale(1.3); opacity: 0; }
}
.cpr-feedback { font-size: 13px; font-weight: 800; height: 18px; margin-bottom: 4px; }
.cpr-feedback.perfect { color: var(--oasis-green); }
.cpr-feedback.fast { color: var(--system-orange); }
.cpr-feedback.slow { color: var(--system-red); }

.modal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(12px);
    z-index: 5000; justify-content: center; align-items: center;
}
.modal-content {
    background: var(--apple-card-bg); border: 1px solid var(--apple-border);
    width: 88%; max-width: 360px; border-radius: 20px; padding: 18px; box-sizing: border-box;
}
.modal-title { font-size: 18px; font-weight: 800; margin-bottom: 10px; }
.input-name {
    width: 100%; padding: 10px; border-radius: 12px; border: 1.5px solid rgba(0,0,0,0.15);
    margin-bottom: 12px; text-align: center; font-size: 14px; font-weight: 700; box-sizing: border-box;
}
.btn-primary {
    background: var(--apple-dark); color: white; border: none; padding: 10px;
    border-radius: 14px; font-weight: 700; width: 100%; cursor: pointer; font-size: 13px; margin-bottom: 6px;
}
.btn-secondary {
    background: rgba(0,0,0,0.06); color: var(--apple-dark); border: none; padding: 8px;
    border-radius: 14px; font-weight: 700; width: 100%; font-size: 12px; cursor: pointer;
}
.rank-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 11px; }
.rank-table th, .rank-table td { padding: 6px 3px; border-bottom: 1px solid rgba(0,0,0,0.05); text-align: center; }
#tipBox {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.88); color: white; padding: 6px 14px;
    border-radius: 16px; font-size: 11px; font-weight: 600; pointer-events: none;
    opacity: 0; transition: opacity 0.25s; z-index: 6000; white-space: nowrap;
}
</style>
<!-- 本地 Firebase SDK（若本機未包含，代碼內已設有零延遲 LocalStorage 自動降級容災） -->
<script src="js/firebase-app-compat.js"></script>
<script src="js/firebase-auth-compat.js"></script>
<script src="js/firebase-database-compat.js"></script>
</head>
<body>

<div class="game-title">🚑 First Aid Pop! 急救突圍</div>

<div class="control-panel">
    <div class="level-badge">第 <span id="current-level">1</span> 關卡</div>
    <div class="btn-group">
        <button class="tool-btn" style="color:var(--oasis-green);" onclick="toggleAudio()">🎵 音效</button>
        <button class="tool-btn" style="color:var(--system-purple);" onclick="triggerUserShuffle()">🎲 洗牌 (<span id="shuffle-count">1</span>)</button>
        <button class="tool-btn" style="color:var(--system-orange);" onclick="showLeaderboardPopup()">🏆 英雄榜</button>
    </div>
</div>

<div class="timer-container"><div id="timer-bar" class="timer-bar"></div></div>

<div class="info-bar">
    <div class="info-pill">剩餘時間: <span id="timer-text" style="color:var(--system-red);">90.0</span>s</div>
    <div class="info-pill">步數: <span id="moves" style="color:var(--oasis-green);">35</span></div>
    <div class="info-pill">救治評分: <span id="score" style="color:var(--system-purple);">0</span></div>
</div>

<div class="scenario-card" id="scenario-card">
    <div class="scenario-title" id="scenario-title">🚨 緊急狀況讀取中</div>
    <div class="scenario-desc" id="scenario-desc">正在檢視傷患生命跡象...</div>
    <div class="protocol-steps" id="protocol-steps"></div>
</div>

<div class="ambulance-action-bar">
    <button id="ambulance-btn" class="btn-ambulance" onclick="useAmbulanceRescue()">
        <span>🚑 救護支援指引</span> (<span id="rescue-count">3</span>次可用)
    </button>
</div>

<div class="board-container" id="board-wrap"><div id="board" class="board"></div></div>

<div id="cpr-stage-container">
    <div class="cpr-title">⚡ 緊急 CPR 110 bpm 胸外按壓！</div>
    <div class="cpr-sub">跟隨紅光節奏點擊心臟，維持大腦供氧！</div>
    <div class="cpr-heart-wrapper">
        <div class="cpr-pulse-ring"></div>
        <button class="cpr-heart-btn" id="cprHeartBtn" type="button">❤️</button>
    </div>
    <div id="cpr-feedback-text" class="cpr-feedback">跟隨節奏點擊...</div>
    <div style="font-size:22px; font-weight:900; margin-bottom:2px;"><span id="cpr-press-left">15</span> 次按壓</div>
    <div style="font-size:11px; color:var(--oasis-green); font-weight:700;">標準速率：100 - 120 次/分鐘</div>
</div>

<!-- 提交英雄榜 Modal -->
<div id="scoreSubmitModal" class="modal">
    <div class="modal-content">
        <div class="modal-title">🩺 登記急救英雄榜</div>
        <p style="font-size:12px; color:var(--apple-gray); margin-bottom:10px;">為本次救援行動留下代號：</p>
        <input type="text" id="heroNameInput" class="input-name" maxlength="12" placeholder="輸入救護員代號">
        <button class="btn-primary" onclick="confirmSubmitScore()">確定送出紀錄</button>
        <button class="btn-secondary" onclick="closeSubmitScoreModal()">稍後再說</button>
    </div>
</div>

<!-- 全球英雄榜 Modal -->
<div id="rankModal" class="modal">
    <div class="modal-content">
        <div class="modal-title">🏆 急救先鋒英雄榜</div>
        <table class="rank-table">
            <thead><tr><th>名次</th><th>代號</th><th>關卡</th><th>救治分</th></tr></thead>
            <tbody id="leaderboard-body"><tr><td colspan="4">載入數據中...</td></tr></tbody>
        </table>
        <button class="btn-primary" onclick="closeLeaderboardPopup()">返回現場</button>
    </div>
</div>

<!-- 結算 Game Over Modal -->
<div id="gameOverModal" class="modal">
    <div class="modal-content">
        <div id="go-main-title" class="modal-title" style="color:var(--system-red);">💀 黃金救援時間耗盡</div>
        <p id="go-reason-text" style="font-size:12px; color:var(--apple-gray); margin-bottom:12px;"></p>
        <div style="background:rgba(0,0,0,0.03); border-radius:12px; padding:10px; margin-bottom:12px; font-size:12px; font-weight:700;">
            <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                <span>到達關卡：</span><span id="go-level-val" style="color:var(--system-purple);">第 1 關</span>
            </div>
            <div style="display:flex; justify-content:space-between;">
                <span>最終評分：</span><span id="go-score-val" style="color:var(--system-red);">0 分</span>
            </div>
        </div>
        <button class="btn-primary" onclick="openSubmitScoreModal()">📝 登記成績至英雄榜</button>
        <button class="btn-secondary" onclick="restartWholeGame()">🔄 重新開始挑戰</button>
    </div>
</div>

<div id="tipBox"></div>

<script>
// --- 1. 雙軌制數據層 (LocalStorage + Firebase 容災互補) ---
let database = null, currentUid = "rescuer_" + Math.random().toString(36).substring(2, 8);
try {
    if (typeof firebase !== "undefined" && firebase.initializeApp) {
        firebase.initializeApp({ databaseURL: "https://first-aid-pop-default-rtdb.firebaseio.com/" });
        database = firebase.database();
        if (firebase.auth) {
            firebase.auth().signInAnonymously().then(c => { currentUid = c.user.uid; }).catch(() => {});
        }
    }
} catch (e) {
    console.warn("運行於本地離線儲存模式");
}

function getLocalLeaderboard() {
    try {
        return JSON.parse(localStorage.getItem("fap_local_ranks") || "[]");
    } catch(e) { return []; }
}
function saveLocalLeaderboard(data) {
    try { localStorage.setItem("fap_local_ranks", JSON.stringify(data)); } catch(e){}
}

// --- 2. 5大醫學急救情境與符號矩陣 ---
const MASTER_ITEMS = {
    "defib": { name: "AED去顫器", text: "⚡" },
    "bandage": { name: "止血繃帶", text: "🩹" },
    "gloves": { name: "無菌手套", text: "🧤" },
    "mask": { name: "人工呼吸面膜", text: "😷" },
    "water": { name: "滅菌生理鹽水", text: "🧴" },
    "splint": { name: "骨折夾板", text: "🩺" },
    "ice": { name: "冰敷降溫包", text: "🧊" },
    "scissors": { name: "急救剪刀", text: "✂️" }
};

const FIRST_AID_SCENARIOS = [
    {
        title: "⚡ 中環街頭：突發心臟驟停 (SCA)",
        desc: "市民突然昏迷無脈搏！【先】消除 5 組 AED 去顫器，【再】進入 110 bpm 胸外按壓！",
        pool: ["defib", "gloves", "mask", "bandage", "scissors"],
        steps: [
            { key: "defib", name: "階段一：AED 電擊去顫", count: 5 },
            { key: "CPR_QTE", name: "階段二：110 bpm 胸外按壓 (QTE)", count: 15 }
        ]
    },
    {
        title: "🩸 地盤工地：動脈噴射性大出血",
        desc: "工人遭金屬割傷大量失血！【先】配戴無菌手套，【再】緊壓止血繃帶！切勿誤用剪刀！",
        pool: ["gloves", "bandage", "water", "defib", "scissors"],
        steps: [
            { key: "gloves", name: "階段一：配戴無菌防護手套", count: 4 },
            { key: "bandage", name: "階段二：緊壓止血繃帶包紮", count: 6 }
        ]
    },
    {
        title: "🫁 餐廳食肆：異物阻塞氣道窒息",
        desc: "食客雙手抱喉無法呼吸！【先】檢查呼吸面膜，【再】施以謙氏急救法衝擊！",
        pool: ["mask", "gloves", "bandage", "water", "scissors"],
        steps: [
            { key: "mask", name: "階段一：清除口腔可見異物", count: 4 },
            { key: "gloves", name: "階段二：實施腹部衝擊包紮", count: 6 }
        ]
    },
    {
        title: "🔥 家居意外：沸水二級燙傷",
        desc: "熱水燙傷大面積紅腫！【先】大量生理鹽水沖洗，【再】無菌敷料輕敷，切勿刺破水泡！",
        pool: ["water", "bandage", "gloves", "ice", "scissors"],
        steps: [
            { key: "water", name: "階段一：滅菌鹽水降溫沖洗", count: 5 },
            { key: "bandage", name: "階段二：無菌透氣繃帶覆蓋", count: 6 }
        ]
    },
    {
        title: "☀️ 郊野遠足：嚴重熱衰竭",
        desc: "行山人士神智不清體溫過高！【先】冰敷降溫，【再】補充電解質鹽水！",
        pool: ["ice", "water", "gloves", "mask", "splint"],
        steps: [
            { key: "ice", name: "階段一：冰敷大動脈位置", count: 5 },
            { key: "water", name: "階段二：補充電解質生理鹽水", count: 5 }
        ]
    }
];

// --- 3. 遊戲核心狀態 ---
const SIZE = 8;
let currentLevel = 1, currentScenario = null, currentStepIndex = 0;
let missionProgress = [], currentLevelTypes = [], grid = [], score = 0, last = null;
let isAnimating = false, moves = 35, timeLeft = 90.0, maxTime = 90.0;
let timerInterval = null, isGameOverDebounce = false;
let rescueUsesLeft = 3, freeShufflesLeft = 1;

// CPR QTE 狀態
let isCprActive = false, cprPressNeeded = 15, lastCprPressTime = 0, cprMetronome = null;

// 音效系統 (Web Audio API 本地合成，零外部依賴)
let audioCtx = null, audioEnabled = true;
function playBeep(freq = 600, duration = 0.1, type = "sine") {
    if (!audioEnabled) return;
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch(e){}
}
function toggleAudio() {
    audioEnabled = !audioEnabled;
    showTip(audioEnabled ? "🎵 音效已啟用" : "🔇 音效已靜音");
}

function showTip(text) {
    const tip = document.getElementById("tipBox");
    tip.innerText = text; tip.style.opacity = 1;
    setTimeout(() => { tip.style.opacity = 0; }, 2000);
}

// --- 4. 棋盤生成與比對 ---
function createBoard() {
    let g = [];
    for (let r = 0; r < SIZE; r++) {
        let row = [];
        for (let c = 0; c < SIZE; c++) {
            let valid = [...currentLevelTypes];
            if (c >= 2 && row[c-1] === row[c-2]) valid = valid.filter(t => t !== row[c-1]);
            if (r >= 2 && g[r-1][c] === g[r-2][c]) valid = valid.filter(t => t !== g[r-1][c]);
            row.push(valid[Math.floor(Math.random() * valid.length)]);
        }
        g.push(row);
    }
    return g;
}

function renderBoard() {
    const boardEl = document.getElementById("board");
    boardEl.innerHTML = "";
    renderProtocolUI();
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            const cell = document.createElement("div");
            cell.className = "cell" + (last && last.r === r && last.c === c ? " selected" : "");
            cell.id = `cell-${r}-${c}`;
            cell.dataset.r = r; cell.dataset.c = c;
            const type = grid[r][c];
            if (type) {
                const disk = document.createElement("div");
                disk.className = "disk";
                disk.innerText = MASTER_ITEMS[type] ? MASTER_ITEMS[type].text : "🩹";
                cell.appendChild(disk);
            }
            boardEl.appendChild(cell);
        }
    }
}

function renderProtocolUI() {
    document.getElementById("scenario-title").innerText = currentScenario.title;
    document.getElementById("scenario-desc").innerText = currentScenario.desc;
    const container = document.getElementById("protocol-steps");
    container.innerHTML = "";
    currentScenario.steps.forEach((step, idx) => {
        const stepEl = document.createElement("div");
        const isDone = missionProgress[idx] <= 0;
        const isActive = (idx === currentStepIndex);
        stepEl.className = `protocol-step ${isDone ? "completed" : (isActive ? "active" : "locked")}`;
        stepEl.innerHTML = `
            <span>${step.key === "CPR_QTE" ? "❤️" : MASTER_ITEMS[step.key].text} ${step.name}</span>
            <span class="step-tag ${isDone ? 'tag-done' : (isActive ? 'tag-active' : '')}">
                ${isDone ? '✓ 處置完畢' : (isActive ? `進行中 (${missionProgress[idx]})` : '鎖定')}
            </span>
        `;
        container.appendChild(stepEl);
    });
}

// --- 5. 互動處理 (消除延遲、鎖死計時器作弊) ---
let dragCell = null, startX = 0, startY = 0;
const boardEl = document.getElementById("board");

boardEl.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (isAnimating || isCprActive || moves <= 0 || timeLeft <= 0) return;
    dragCell = e.target.closest(".cell");
    if (dragCell) { startX = e.clientX; startY = e.clientY; }
});

boardEl.addEventListener("pointerup", e => {
    e.preventDefault();
    if (!dragCell || isAnimating || isCprActive) return;
    const diffX = e.clientX - startX, diffY = e.clientY - startY;
    const r1 = parseInt(dragCell.dataset.r), c1 = parseInt(dragCell.dataset.c);
    if (Math.abs(diffX) > 15 || Math.abs(diffY) > 15) {
        let r2 = r1, c2 = c1;
        if (Math.abs(diffX) > Math.abs(diffY)) c2 += diffX > 0 ? 1 : -1;
        else r2 += diffY > 0 ? 1 : -1;
        if (r2 >= 0 && r2 < SIZE && c2 >= 0 && c2 < SIZE) {
            last = null; handleCellSelect(r1, c1); handleCellSelect(r2, c2);
        }
    } else {
        handleCellSelect(r1, c1);
    }
    dragCell = null;
});

function handleCellSelect(r, c) {
    if (!last) { last = {r, c}; renderBoard(); return; }
    const dr = Math.abs(last.r - r), dc = Math.abs(last.c - c);
    if (dr + dc === 1) {
        isAnimating = true;
        [grid[r][c], grid[last.r][last.c]] = [grid[last.r][last.c], grid[r][c]];
        renderBoard();
        setTimeout(() => {
            if (!checkMatches()) {
                // 交換無效退回
                [grid[r][c], grid[last.r][last.c]] = [grid[last.r][last.c], grid[r][c]];
                isAnimating = false; last = null; renderBoard();
                playBeep(220, 0.15, "triangle");
            } else {
                moves--;
                document.getElementById("moves").innerText = moves;
                last = null;
            }
        }, 160);
    } else {
        last = {r, c}; renderBoard();
    }
}

function checkMatches() {
    let toRemove = Array.from({length: SIZE}, () => Array(SIZE).fill(false));
    let hasMatch = false;

    // 橫排檢查
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE - 2; c++) {
            if (grid[r][c] && grid[r][c] === grid[r][c+1] && grid[r][c] === grid[r][c+2]) {
                toRemove[r][c] = toRemove[r][c+1] = toRemove[r][c+2] = true; hasMatch = true;
            }
        }
    }
    // 直排檢查
    for (let c = 0; c < SIZE; c++) {
        for (let r = 0; r < SIZE - 2; r++) {
            if (grid[r][c] && grid[r][c] === grid[r+1][c] && grid[r][c] === grid[r+2][c]) {
                toRemove[r][c] = toRemove[r+1][c] = toRemove[r+2][c] = true; hasMatch = true;
            }
        }
    }

    if (hasMatch) {
        resolveElimination(toRemove);
        return true;
    }
    return false;
}

function resolveElimination(toRemove) {
    const targetKey = currentScenario.steps[currentStepIndex].key;
    let targetCount = 0, misstepCount = 0;

    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            if (toRemove[r][c]) {
                if (grid[r][c] === targetKey) targetCount++;
                else misstepCount++;
                grid[r][c] = null;
            }
        }
    }

    if (targetCount > 0) {
        // 正確急救處置
        playBeep(880, 0.18, "sine");
        score += targetCount * 150;
        missionProgress[currentStepIndex] = Math.max(0, missionProgress[currentStepIndex] - Math.floor(targetCount / 3));
    }

    if (misstepCount > 0 && targetCount === 0) {
        // 處置順序失當懲罰：倒扣 2.0 秒黃金急救時間
        timeLeft = Math.max(0, timeLeft - 2.0);
        playBeep(150, 0.25, "sawtooth");
        const card = document.getElementById("scenario-card");
        card.classList.add("card-penalty");
        showTip("⚠️ 處置失當！黃金急救時間 -2.0 秒！");
        setTimeout(() => card.classList.remove("card-penalty"), 300);
    }

    document.getElementById("score").innerText = score;

    if (missionProgress[currentStepIndex] <= 0) {
        if (currentStepIndex === 0 && currentScenario.steps[1].key === "CPR_QTE") {
            triggerCprQte();
            return;
        } else if (currentStepIndex < currentScenario.steps.length - 1) {
            currentStepIndex++;
            showTip("✅ 第一階段處置成功，展開下一處置！");
        }
    }
    setTimeout(dropRefill, 250);
}

function dropRefill() {
    for (let c = 0; c < SIZE; c++) {
        let p = SIZE - 1;
        for (let r = SIZE - 1; r >= 0; r--) {
            if (grid[r][c] !== null) { grid[p][c] = grid[r][c]; p--; }
        }
        while (p >= 0) {
            grid[p][c] = currentLevelTypes[Math.floor(Math.random() * currentLevelTypes.length)];
            p--;
        }
    }
    renderBoard();
    setTimeout(() => {
        if (!checkMatches()) {
            isAnimating = false;
            checkGameState();
        }
    }, 160);
}

// --- 6. 專業 110 bpm CPR QTE 判定 ---
function triggerCprQte() {
    isCprActive = true; currentStepIndex = 1;
    cprPressNeeded = currentScenario.steps[1].count;
    lastCprPressTime = 0;
    document.getElementById("cpr-press-left").innerText = cprPressNeeded;
    document.getElementById("board-wrap").style.display = "none";
    document.querySelector(".ambulance-action-bar").style.display = "none";
    document.getElementById("cpr-stage-container").style.display = "block";
    renderProtocolUI();
    showTip("🚨 心跳驟停！跟隨 110 bpm 節拍點擊心臟按壓！");
    if (cprMetronome) clearInterval(cprMetronome);
    cprMetronome = setInterval(() => { playBeep(800, 0.08, "sine"); }, 545);
}

document.getElementById("cprHeartBtn").addEventListener("pointerdown", e => {
    e.preventDefault();
    if (!isCprActive || cprPressNeeded <= 0 || timeLeft <= 0) return;
    const now = Date.now();
    const feedback = document.getElementById("cpr-feedback-text");
    let pointDelta = 150;

    if (lastCprPressTime > 0) {
        const interval = now - lastCprPressTime;
        if (interval < 420) {
            feedback.className = "cpr-feedback fast"; feedback.innerText = "⚠️ 按壓過快！維持每分鐘 100-120 次";
            playBeep(950, 0.08, "sine"); pointDelta = 80;
        } else if (interval > 680) {
            feedback.className = "cpr-feedback slow"; feedback.innerText = "⚠️ 按壓過慢！跟隨紅光脈衝節奏";
            playBeep(260, 0.1, "triangle"); pointDelta = 80;
        } else {
            feedback.className = "cpr-feedback perfect"; feedback.innerText = "✨ 節奏完美 (PERFECT 110 bpm)";
            playBeep(660, 0.12, "sine"); pointDelta = 300;
        }
    } else {
        feedback.className = "cpr-feedback perfect"; feedback.innerText = "❤️ 持續胸外按壓！";
    }

    lastCprPressTime = now;
    cprPressNeeded--;
    missionProgress[1] = cprPressNeeded;
    score += pointDelta;
    document.getElementById("score").innerText = score;
    document.getElementById("cpr-press-left").innerText = cprPressNeeded;

    if (cprPressNeeded <= 0) {
        isCprActive = false; clearInterval(cprMetronome);
        feedback.className = "cpr-feedback perfect"; feedback.innerText = "🎉 搶救成功！自主心跳已重啟！";
        showTip("🎉 搶救成功！患者脫離險境！");
        setTimeout(() => { currentLevel++; setupLevel(); }, 900);
    }
});

// --- 7. 救護車 (急救指引) vs 有限洗牌 ---
function scanValidMove() {
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            let dirs = [[0, 1], [1, 0]];
            for (let [dr, dc] of dirs) {
                let nr = r + dr, nc = c + dc;
                if (nr < SIZE && nc < SIZE) {
                    [grid[r][c], grid[nr][nc]] = [grid[nr][nc], grid[r][c]];
                    let ok = false;
                    for (let x = 0; x < SIZE; x++) {
                        for (let y = 0; y < SIZE - 2; y++) {
                            if (grid[x][y] && grid[x][y] === grid[x][y+1] && grid[x][y] === grid[x][y+2]) ok = true;
                            if (grid[y][x] && grid[y][x] === grid[y+1][x] && grid[y][x] === grid[y+2][x]) ok = true;
                        }
                    }
                    [grid[r][c], grid[nr][nc]] = [grid[nr][nc], grid[r][c]];
                    if (ok) return { r1: r, c1: c, r2: nr, c2: nc };
                }
            }
        }
    }
    return null;
}

function useAmbulanceRescue() {
    if (rescueUsesLeft <= 0 || isAnimating || isCprActive || timeLeft <= 0) return;
    const move = scanValidMove();
    if (move) {
        rescueUsesLeft--;
        document.getElementById("rescue-count").innerText = rescueUsesLeft;
        if (rescueUsesLeft === 0) document.getElementById("ambulance-btn").disabled = true;
        const c1 = document.getElementById(`cell-${move.r1}-${move.c1}`);
        const c2 = document.getElementById(`cell-${move.r2}-${move.c2}`);
        if (c1 && c2) {
            c1.classList.add("hint-glow"); c2.classList.add("hint-glow");
            setTimeout(() => { c1.classList.remove("hint-glow"); c2.classList.remove("hint-glow"); }, 1500);
        }
        timeLeft = Math.min(maxTime, timeLeft + 3.0); // 獎勵 3 秒
        showTip("🚑 救護專家標記最優處置，時間 +3s！");
        playBeep(700, 0.2, "sine");
    } else {
        grid = createBoard(); renderBoard();
        showTip("🚑 盤面無可行解：救護隊自動重整物資！");
    }
}

function triggerUserShuffle() {
    if (isAnimating || isCprActive || timeLeft <= 0) return;
    if (freeShufflesLeft > 0) {
        freeShufflesLeft--;
        grid = createBoard(); renderBoard();
        document.getElementById("shuffle-count").innerText = freeShufflesLeft;
        showTip("🎲 盤面急救物資已重新分配！");
    } else if (moves > 3) {
        moves -= 2;
        grid = createBoard(); renderBoard();
        document.getElementById("moves").innerText = moves;
        showTip("🎲 額外洗牌消耗 2 次調配步數！");
    } else {
        showTip("⚠️ 步數不足，無法洗牌！");
    }
}

// --- 8. 計時器與狀態監控 ---
function startTimer() {
    clearInterval(timerInterval);
    timeLeft = maxTime;
    timerInterval = setInterval(() => {
        // 計時器絕不停頓，嚴防思考作弊
        timeLeft -= 0.1;
        if (timeLeft <= 0) {
            timeLeft = 0; clearInterval(timerInterval); checkGameState(true);
        }
        document.getElementById("timer-bar").style.width = (timeLeft / maxTime * 100) + "%";
        document.getElementById("timer-text").innerText = Math.max(0, timeLeft).toFixed(1);
    }, 100);
}

function checkGameState(timeOut = false) {
    if (isGameOverDebounce) return;
    const allDone = missionProgress.every(v => v <= 0);
    if (allDone && !isCprActive) {
        showTip(`🎉 第 ${currentLevel} 關救援成功！`);
        setTimeout(() => { currentLevel++; setupLevel(); }, 800);
        return;
    }
    if (moves <= 0 || timeOut) {
        isGameOverDebounce = true;
        clearInterval(timerInterval);
        if (cprMetronome) clearInterval(cprMetronome);
        document.getElementById("go-main-title").innerText = timeOut ? "⏱️ 黃金時間耗盡" : "🛑 物資步數耗盡";
        document.getElementById("go-reason-text").innerText = timeOut ? "傷患已喪失生命體徵，未能及時送院！" : "現場物資調配步數用盡，急救中斷！";
        document.getElementById("go-level-val").innerText = `第 ${currentLevel} 關卡`;
        document.getElementById("go-score-val").innerText = `${score} 分`;
        document.getElementById("gameOverModal").style.display = "flex";
    }
}

function setupLevel() {
    isAnimating = false; isCprActive = false; last = null; isGameOverDebounce = false;
    if (cprMetronome) { clearInterval(cprMetronome); cprMetronome = null; }
    document.getElementById("board-wrap").style.display = "block";
    document.querySelector(".ambulance-action-bar").style.display = "flex";
    document.getElementById("cpr-stage-container").style.display = "none";
    document.getElementById("current-level").innerText = currentLevel;

    const sIdx = (currentLevel - 1) % FIRST_AID_SCENARIOS.length;
    currentScenario = JSON.parse(JSON.stringify(FIRST_AID_SCENARIOS[sIdx]));
    currentStepIndex = 0;
    missionProgress = currentScenario.steps.map(s => s.count);
    currentLevelTypes = [...currentScenario.pool];
    
    moves = 35; document.getElementById("moves").innerText = moves;
    freeShufflesLeft = 1; document.getElementById("shuffle-count").innerText = freeShufflesLeft;
    rescueUsesLeft = 3; document.getElementById("rescue-count").innerText = rescueUsesLeft;
    document.getElementById("ambulance-btn").disabled = false;

    grid = createBoard();
    renderBoard();
    startTimer();
}

function restartWholeGame() {
    document.getElementById("gameOverModal").style.display = "none";
    currentLevel = 1; score = 0;
    document.getElementById("score").innerText = score;
    setupLevel();
}

// --- 9. 英雄榜提交與同步邏輯 (徹底解決笑話與卡死問題) ---
function openSubmitScoreModal() {
    document.getElementById("gameOverModal").style.display = "none";
    document.getElementById("heroNameInput").value = localStorage.getItem("fap_hero_name") || "仁心救護員";
    document.getElementById("scoreSubmitModal").style.display = "flex";
}
function closeSubmitScoreModal() {
    document.getElementById("scoreSubmitModal").style.display = "none";
    document.getElementById("gameOverModal").style.display = "flex";
}

function confirmSubmitScore() {
    const name = document.getElementById("heroNameInput").value.trim() || "無名英雄";
    localStorage.setItem("fap_hero_name", name);
    const entry = { name: name, level: currentLevel, score: score, timestamp: Date.now() };

    // 1. 本地 LocalStorage 必定即時寫入
    let localRanks = getLocalLeaderboard();
    localRanks.push(entry);
    localRanks.sort((a, b) => b.score - a.score);
    saveLocalLeaderboard(localRanks.slice(0, 15));

    // 2. 若 Firebase 可用，則並行寫入雲端
    if (database) {
        database.ref("leaderboard").push({ ...entry, uid: currentUid }).catch(() => {});
    }

    showTip("🚀 救援戰績已成功登記！");
    document.getElementById("scoreSubmitModal").style.display = "none";
    showLeaderboardPopup();
}

function showLeaderboardPopup() {
    const tbody = document.getElementById("leaderboard-body");
    tbody.innerHTML = `<tr><td colspan="4">載入榜單中...</td></tr>`;
    document.getElementById("rankModal").style.display = "flex";

    function renderTable(list) {
        tbody.innerHTML = "";
        if (!list || list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4">尚無紀錄，搶佔第一！</td></tr>`; return;
        }
        list.slice(0, 10).forEach((p, idx) => {
            const medal = idx === 0 ? '🥇' : (idx === 1 ? '🥈' : (idx === 2 ? '🥉' : idx + 1));
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${medal}</td>
                <td>${p.name}</td>
                <td>第 ${p.level} 關</td>
                <td style="color:var(--system-purple); font-weight:800;">${p.score}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 優先讀取雲端，遇阻秒級退回本地緩存，絕不卡死
    if (database) {
        let isCloudSuccess = false;
        database.ref("leaderboard").orderByChild("score").limitToLast(10).once("value", snap => {
            isCloudSuccess = true;
            let list = [];
            snap.forEach(c => { list.push(c.val()); });
            list.reverse();
            renderTable(list);
        }).catch(() => {
            renderTable(getLocalLeaderboard());
        });
        setTimeout(() => { if (!isCloudSuccess) renderTable(getLocalLeaderboard()); }, 1200);
    } else {
        renderTable(getLocalLeaderboard());
    }
}
function closeLeaderboardPopup() { document.getElementById("rankModal").style.display = "none"; }

// 啟動遊戲
setupLevel();
</script>
