<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>First Aid Pop 急救彈彈樂!</title>

<style>
body{
    margin:0;
    background:#d8f1ff;
    text-align:center;
    font-family: 'Arial Black', Arial, sans-serif;
    touch-action: none;
    user-select: none;
    padding: 10px;
    box-sizing: border-box;
}

/* 遊戲標題招牌 */
.game-title {
    margin: 5px 0;
    color: #e74c3c;
    font-size: 24px;
    font-weight: 900;
    text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff, 3px 3px 5px rgba(0,0,0,0.2);
    letter-spacing: 1px;
    line-height: 1.2;
}

.info-bar { 
    font-size: 18px; 
    font-weight: bold; 
    margin: 5px 0 10px 0; 
    color: #2c3e50; 
    font-family: Arial, sans-serif;
}

/* 🧰 藥箱按鈕樣式 - 手機自適應與卡通公仔圖片結合 */
.btn-kit {
    background-color: #e74c3c;
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 25px;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.15);
    margin-bottom: 12px;
    transition: 0.2s;
    width: 85%;
    max-width: 320px;
    font-family: Arial, sans-serif;
    
    /* 載入藥箱公仔圖案 */
    background-image: url('https://img.icons8.com/emoji/96/first-aid-kit-emoji.png');
    background-repeat: no-repeat;
    background-position: 15px center; 
    background-size: 28px; 
    padding-left: 55px; 
}
.btn-kit:hover { background-color: #c0392b; }
.btn-kit:disabled { background-color: #95a5a6; cursor: not-allowed; box-shadow: none; opacity: 0.7; }

/* 💡 藥箱提示閃爍動畫 */
.hint-flash { animation: flash-glow 0.4s ease-in-out 3; }
@keyframes flash-glow {
    0%, 100% { background-color: #fff; }
    50% { background-color: #f1c40f; transform: scale(1.05); border-radius: 18%; }
}

/* RWD 棋盤外層容器 */
.board-container {
    position: relative;
    display: block;
    margin: 0 auto;
    width: 100%;
    max-width: 520px; 
    box-sizing: border-box;
}

/* 自動彈性棋盤 */
.board{
    display: grid;
    grid-template-columns: repeat(8, 1fr); 
    gap: 1.2vw; 
    justify-content: center;
    background: rgba(255, 255, 255, 0.3);
    padding: 8px;
    border-radius: 12px;
}

/* 完美正方形格子自適應螢幕 */
.cell{
    width: 100%;
    aspect-ratio: 1 / 1; 
    background: #fff;
    border-radius: 18%; 
    position: relative;
    box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
    box-sizing: border-box;
}

/* 點選高亮框 */
.selected {
    border: 3px solid #e74c3c !important;
    background: #ffeaea !important;
}

.disk{
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    font-size: 7.5vw; 
    cursor: pointer;
    transition: transform 0.1s ease;
}
.disk:active { transform: scale(0.9); }

/* 💥 爆炸粒子改進（相對於棋盤定位，不被重繪切斷） */
.particle{
    position: absolute;
    font-size: 5vw; 
    pointer-events: none;
    z-index: 999;
    animation: explode 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
}
@keyframes explode{
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--x),var(--y)) scale(0.5); opacity:0; }
}

.control-panel { margin: 5px; }
.music-btn{
    padding: 6px 12px;
    border: none; border-radius: 15px;
    background: #2ecc71; color: #fff; font-weight: bold;
    cursor: pointer; box-shadow: 0 3px 5px rgba(0,0,0,0.1);
    font-size: 13px;
    font-family: Arial, sans-serif;
}
.music-btn:active { transform: scale(0.95); }

/* 電腦版大螢幕優化 */
@media (min-width: 520px) {
    .board { gap: 6px; }
    .disk { font-size: 34px; }
    .particle { font-size: 20px; }
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body>

<div class="game-title">🚑 First Aid Pop! <br><span style="color:#1a5f7a; font-size:18px;">急救彈彈樂!</span></div>

<div class="control-panel">
    <button class="music-btn" onclick="toggleMusic()">🎵 音樂開關 (BGM)</button>
</div>

<div class="info-bar">得分: <span id="score">0</span></div>

<button id="kit-btn" class="btn-kit" onclick="useFirstAidKit()">藥箱急救 (剩餘 3 次)</button>

<div class="board-container" id="game-container">
    <div id="board" class="board"></div>
</div>

<script>
// ===== 基本變數 =====
const SIZE=8;
const TYPES=["😷","🏋️","🩺","💉","🚑","💊","🩹","🥼"];
let grid=[], score=0;
let last=null; 
let isAnimating = false; 
let kitCount = 3; 

const board=document.getElementById("board");
const gameContainer = document.getElementById("game-container");
const kitBtn=document.getElementById("kit-btn");

// ===== 🔊 音效 =====
const sounds={
 match: new Audio("https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3"),
};

function playSound(s){
 try {
     let a=s.cloneNode(); a.volume=0.4; a.play();
 } catch(e) {}
}

// ===== 🎵 背景音樂 =====
const bgm=new Audio("https://assets.mixkit.co/music/preview/mixkit-game-level-music-689.mp3");
bgm.loop=true;
bgm.volume=0.3;

function toggleMusic(){
 if(bgm.paused) bgm.play().catch(()=>{ alert("請先點擊畫面上任意地方激活音源"); });
 else bgm.pause();
}

document.body.addEventListener("pointerdown",()=>{
 bgm.play().catch(()=>{});
},{once:true});

// ===== 📳 震動 =====
function vibrate(){
 if(navigator.vibrate){ navigator.vibrate(60); }
}

// ===== 💥 修正後的粒子特效 =====
function explodeEffect(r,c){
 const cell=document.getElementById(`cell-${r}-${c}`);
 if(!cell) return;

 const offsetLeft = cell.offsetLeft + cell.offsetWidth / 2 - 10;
 const offsetTop = cell.offsetTop + cell.offsetHeight / 2 - 10;

 const isMobile = window.innerWidth < 520;
 const spreadRange = isMobile ? window.innerWidth * 0.2 : 60;

 for(let i=0;i<8;i++){
   let p=document.createElement("div");
   p.className="particle";
   p.innerText= ["✨","💥","✨"][Math.floor(Math.random()*3)]; 
   p.style.left = offsetLeft + "px";
   p.style.top = offsetTop + "px";

   let x=(Math.random() * (spreadRange * 2) - spreadRange) + "px";
   let y=(Math.random() * (spreadRange * 2) - spreadRange) + "px";

   p.style.setProperty("--x",x);
   p.style.setProperty("--y",y);

   gameContainer.appendChild(p);
   setTimeout(()=>p.remove(),600);
 }
}

// ===== 開局防直接消除的棋盤生成 =====
function create(){
 let g;
 do {
    g = [];
    for(let r=0;r<SIZE;r++){
       let row=[];
       for(let c=0;c<SIZE;c++){
         row.push(TYPES[Math.floor(Math.random()*8)]);
       }
       g.push(row);
    }
 } while(hasMatch(g)); 
 return g;
}

function hasMatch(g){
    for(let r=0;r<SIZE;r++){
        for(let c=0;c<SIZE;c++){
            if(c<=SIZE-3 && g[r][c] && g[r][c]===g[r][c+1] && g[r][c]===g[r][c+2]) return true;
            if(r<=SIZE-3 && g[r][c] && g[r][c]===g[r+1][c] && g[r][c]===g[r+2][c]) return true;
        }
    }
    return false;
}

// ===== 渲染畫面 =====
function render(){
 board.innerHTML="";
 grid.forEach((row,r)=>{
   row.forEach((cell,c)=>{
     let div=document.createElement("div");
     div.className="cell";
     div.id=`cell-${r}-${c}`;

     if(last && last.r === r && last.c === c) {
         div.classList.add("selected");
     }

     if(cell){
       let d=document.createElement("div");
       d.className="disk";
       d.innerText=cell;
       d.onclick=()=>click(r,c);
       div.appendChild(d);
     }
     board.appendChild(div);
   });
 });
}

// ===== 點擊交換處理 =====
function click(r,c){
 if(isAnimating) return; 

 if(!last){
     last={r,c}; 
     render(); 
     return;
 }

 let dr=Math.abs(last.r-r);
 let dc=Math.abs(last.c-c);

 if(dr+dc==1){
   isAnimating = true;
   [grid[r][c],grid[last.r][last.c]]=[grid[last.r][last.c],grid[r][c]];
   render();

   setTimeout(() => {
       if(!checkMatchesAndEliminate(r, c, last.r, last.c)) {
           // 交換無效，播放絲滑彈回
           [grid[r][c],grid[last.r][last.c]]=[grid[last.r][last.c],grid[r][c]];
           isAnimating = false;
           last = null;
           render();
       } else {
           last = null;
       }
   }, 150);
 } else {
   last={r,c};
   render();
 }
}

// ===== 橫向與直向的完美消除判定 =====
function checkMatchesAndEliminate(r1, c1, r2, c2) {
 let toRemove = Array.from({length: SIZE}, () => Array(SIZE).fill(false));
 let hasMatchFound = false;

 for(let r=0;r<SIZE;r++){
   for(let c=0;c<SIZE-2;c++){
     let v=grid[r][c];
     if(v && v===grid[r][c+1] && v===grid[r][c+2]){
       toRemove[r][c] = toRemove[r][c+1] = toRemove[r][c+2] = true;
       hasMatchFound = true;
     }
   }
 }

 for(let c=0;c<SIZE;c++){
   for(let r=0;r<SIZE-2;r++){
     if(grid[r][c] && grid[r][c]===grid[r+1][c] && grid[r][c]===grid[r+2][c]){
       toRemove[r][c] = toRemove[r+1][c] = toRemove[r+2][c] = true;
       hasMatchFound = true;
     }
   }
 }

 if(hasMatchFound){
   let removedCount = 0;
   for(let r=0;r<SIZE;r++){
     for(let c=0;c<SIZE;c++){
       if(toRemove[r][c]) {
         explodeEffect(r,c); 
         grid[r][c]=null; 
         removedCount++;
       }
     }
   }

   playSound(sounds.match);
   vibrate(); 
   score+=removedCount*10;
   document.getElementById("score").innerText=score;
   
   setTimeout(drop, 250);
   return true;
 }
 return false;
}

// ===== 自動連鎖檢查 (Combo) =====
function autoCheckLoop() {
    let toRemove = Array.from({length: SIZE}, () => Array(SIZE).fill(false));
    let hasMatchFound = false;

    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE-2;c++){
        let v=grid[r][c];
        if(v && v===grid[r][c+1] && v===grid[r][c+2]) toRemove[r][c] = toRemove[r][c+1] = toRemove[r][c+2] = hasMatchFound = true;
      }
    }
    for(let c=0;c<SIZE;c++){
      for(let r=0;r<SIZE-2;r++){
        if(grid[r][c] && grid[r][c]===grid[r+1][c] && grid[r][c]===grid[r+2][c]) toRemove[r][c] = toRemove[r+1][c] = toRemove[r+2][c] = hasMatchFound = true;
      }
    }

    if(hasMatchFound) {
        let count = 0;
        for(let r=0;r<SIZE;r++){
          for(let c=0;c<SIZE;c++){
            if(toRemove[r][c]) { explodeEffect(r,c); grid[r][c]=null; count++; }
          }
        }
        score += count * 10;
        document.getElementById("score").innerText=score;
        playSound(sounds.match);
        vibrate();
        setTimeout(drop, 250);
    } else {
        isAnimating = false; // 連鎖結束，解鎖面板
    }
}

// ===== 掉落補滿 =====
function drop(){
 for(let c=0;c<SIZE;c++){
   let col=[];
   for(let r=0;r<SIZE;r++)
     if(grid[r][c]) col.push(grid[r][c]);

   while(col.length<SIZE)
     col.unshift(TYPES[Math.floor(Math.random()*8)]);

   for(let r=0;r<SIZE;r++)
     grid[r][c]=col[r];
 }
 render();
 setTimeout(autoCheckLoop, 150);
}

// ===== 藥箱掃描演算法 =====
function scanForHint(){
    for(let r=0;r<SIZE;r++){
        for(let c=0;c<SIZE;c++){
            let dirs=[[0,1],[1,0]];
            for(let [dr,dc] of dirs){
                let nr=r+dr,nc=c+dc;
                if(nr<SIZE && nc<SIZE){
                    [grid[r][c],grid[nr][nc]]=[grid[nr][nc],grid[r][c]];
                    
                    let hasMatchFound = false;
                    for(let tr=0;tr<SIZE;tr++){
                      for(let tc=0;tc<SIZE-2;tc++){
                        if(grid[tr][tc] && grid[tr][tc]===grid[tr][tc+1] && grid[tr][tc]===grid[tr][tc+2]) hasMatchFound = true;
                      }
                    }
                    for(let tc=0;tc<SIZE;tc++){
                      for(let tr=0;tr<SIZE-2;tr++){
                        if(grid[tr][tc] && grid[tr][tc]===grid[tr+1][tc] && grid[tr][tc]===grid[tr+2][tc]) hasMatchFound = true;
                      }
                    }

                    [grid[r][c],grid[nr][nc]]=[grid[nr][nc],grid[r][c]]; 
                    
                    if(hasMatchFound) {
                        return { p1: {r, c}, p2: {r: nr, c: nc} };
                    }
                }
            }
        }
    }
    return null;
}

// ===== 點擊藥箱急救功能 =====
function useFirstAidKit() {
    if(kitCount <= 0 || isAnimating) return;

    let hint = scanForHint();

    if(hint) {
        kitCount--;
        kitBtn.innerText = `藥箱急救 (剩餘 ${kitCount} 次)`;
        if(kitCount === 0) kitBtn.disabled = true;

        isAnimating = true; 
        let cell1 = document.getElementById(`cell-${hint.p1.r}-${hint.p1.c}`);
        let cell2 = document.getElementById(`cell-${hint.p2.r}-${hint.p2.c}`);

        cell1.classList.add("hint-flash");
        cell2.classList.add("hint-flash");

        setTimeout(() => {
            cell1.classList.remove("hint-flash");
            cell2.classList.remove("hint-flash");
            isAnimating = false;
        }, 1200); 
    } else {
        alert("🩺 藥箱掃描：目前盤面已無任何可行解法，免費為您重新洗牌！");
        grid = create();
        render();
    }
}

// ===== Firebase 預留區 =====
/*
const firebaseConfig = {
 apiKey:"YOUR_API_KEY",
 authDomain:"YOUR_AUTH_DOMAIN",
 projectId:"YOUR_PROJECT_ID",

 appId:"YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
function saveScore(){
 db.collection("scores").add({ score: score, time: Date.now() });
}
*/

// ===== 啟動遊戲 =====
grid=create();
render();
</script>

</body>
</html>
